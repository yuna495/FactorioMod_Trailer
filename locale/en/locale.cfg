[entity-description]
trailer-head=A drivable semi-trailer head that automatically creates one cargo trailer behind it.
double-trailer-head=A drivable double-trailer head that automatically creates two cargo trailers behind it.
trailer-cargo=A scripted cargo trailer that follows a trailer head with simple semi-trailer kinematics.
trailer-rail-locomotive=A War Rig-styled locomotive that uses standard train fuel and rail behavior.
trailer-rail-cargo-wagon=A War Rig-styled cargo wagon with the road trailer cargo capacity.
trailer-rail-fluid-wagon=A War Rig-styled fluid wagon with standard fluid wagon behavior.
trailer-road-rails=Road-styled rails for War Rig trains. Normal trains can use them too.

